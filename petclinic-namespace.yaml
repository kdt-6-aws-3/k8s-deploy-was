# PetClinic 3계층(web · was · db)을 담는 Namespace
# 차트보다 먼저 만든다: kubectl apply -f petclinic-namespace.yaml
# Pod Security Admission restricted: non-root · 권한 상승 금지 · capability 제거를 강제한다 (ADR-004)
apiVersion: v1
kind: Namespace
metadata:
  name: petclinic
  labels:
    app.kubernetes.io/part-of: petclinic
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
