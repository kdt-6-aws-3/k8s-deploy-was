apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: {{ .Values.datasource.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ required "datasource.password 값이 필요합니다 (--set datasource.password=...)" .Values.datasource.password | quote }}
