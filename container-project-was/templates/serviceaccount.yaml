# 이 앱 전용 ServiceAccount. Role · RoleBinding을 붙이지 않아 API 권한이 없다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: petclinic
  {{- with .Values.serviceAccount.annotations }}
  # EKS: IRSA 역할 연결 (eks.amazonaws.com/role-arn)
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
