apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/version: {{ .Values.image.tag | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: petclinic
      annotations:
        # ConfigMap · Secret 값이 바뀌면 Pod를 다시 만든다
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # preStop sleep + server.shutdown=graceful(20s)보다 길게 둔다
      terminationGracePeriodSeconds: {{ add .Values.preStopSleepSeconds 30 }}
      containers:
        - name: was
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Values.name }}
            - secretRef:
                name: {{ .Values.name }}
          {{- if .Values.logs.enabled }}
          env:
            # logback(eks 프로파일)이 ${LOG_DIR}/app.log에 쓴다. 로그 필드 pod에도 들어간다
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOG_DIR
              value: {{ .Values.logs.mountPath | quote }}
          volumeMounts:
            # EFS PVC 안 <dir>/<Pod 이름>/ 에만 쓴다. 레플리카끼리 같은 파일을 쓰지 않는다
            - name: logs
              mountPath: {{ .Values.logs.mountPath }}
              subPathExpr: {{ .Values.logs.dir }}/$(POD_NAME)
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          # ADR-003: Spring Boot Actuator probe 경로 사용
          # 샘플 데이터 적재(sqlInitMode=always) 중에는 기동이 오래 걸리므로 startupProbe로 여유를 준다
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.logs.enabled }}
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: {{ .Values.logs.claimName }}
      {{- end }}
