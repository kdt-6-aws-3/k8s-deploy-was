# Service 이름이 곧 DNS 이름이다. web의 WAS_HOST와 맞춘다
name: was

replicaCount: 2

image:
  repository: ghcr.io/kdt-6-aws-3/container-project-was
  tag: "0.0.3"
  pullPolicy: IfNotPresent

# GHCR 패키지가 public이라 pull용 Secret이 필요 없다
imagePullSecrets: []

# ConfigMap으로 넣는 일반 설정 (Compose의 was.env 중 비밀이 아닌 값)
config:
  springProfilesActive: mysql
  datasourceUrl: jdbc:mysql://db:3306/petclinic
  # 샘플 데이터 적재: 빈 DB에 처음 설치할 때만 always + replicaCount=1, 이후에는 never
  sqlInitMode: never
  logLevel: INFO
  appEnv: production
  timezone: Asia/Seoul
  javaOpts: "-XX:MaxRAMPercentage=75"

# Secret으로 넣는 값. db 차트의 auth.username · auth.password와 같아야 한다
datasource:
  username: petclinic_app
  password: ""

service:
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    # JAVA_OPTS의 MaxRAMPercentage는 이 limit을 기준으로 힙 크기를 정한다
    memory: 1Gi

# 이미지의 실행 사용자 petclinic (UID/GID 10001)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# 노드(hostname)마다 Pod 수 차이를 1 이하로 유지한다
# nodeTaintsPolicy: Honor - taint가 있는 cp는 분산 대상에서 뺀다 (안 빼면 rollout 중 surge Pod가 Pending)
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    nodeTaintsPolicy: Honor
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: was
    # 같은 ReplicaSet(revision) Pod끼리만 센다. 없으면 rollout 중 이전 Pod까지 세어 새 Pod가 한 노드에 몰린다
    matchLabelKeys:
      - pod-template-hash

# 자발적 중단(drain 등)에도 최소 1개는 남긴다
pdb:
  enabled: true
  minAvailable: 1

# 종료 직전 대기: Service Endpoint에서 빠지는 동안(kube-proxy 반영 지연) 기존 Pod가 요청을 계속 받게 한다
preStopSleepSeconds: 10

# 전용 ServiceAccount: default SA를 같이 쓰지 않는다
# 앱이 Kubernetes API를 호출하지 않으므로 API 토큰을 Pod에 마운트하지 않는다
serviceAccount:
  automountToken: false

# 파일 로그를 PVC(EFS 등)에 쓴다. 끄면 stdout만 쓴다 (kubeadm 기본)
logs:
  enabled: false
  claimName: ""
  mountPath: /logs
  # PVC 안 디렉터리: <dir>/<Pod 이름>/app.log
  dir: was
