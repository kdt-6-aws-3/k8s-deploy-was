apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  MYSQL_DATABASE: {{ .Values.auth.database | quote }}
  MYSQL_USER: {{ .Values.auth.username | quote }}
  MYSQL_ROOT_PASSWORD: {{ required "auth.rootPassword 값이 필요합니다 (--set auth.rootPassword=...)" .Values.auth.rootPassword | quote }}
  MYSQL_PASSWORD: {{ required "auth.password 값이 필요합니다 (--set auth.password=...)" .Values.auth.password | quote }}
